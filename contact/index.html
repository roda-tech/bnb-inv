<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>BNB Manager - Bed & Breakfast Operations</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css?v=20260728-1" />
  </head>
  <body>
    <!-- App Shell -->
    <div class="app-shell">
      <!-- Top Navigation & Header -->
      <header class="app-header">
        <div class="brand" onclick="window.location.href='/'" style="cursor: pointer;">
          <div class="brand-icon" >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <div onclick="window.location.href='/'" style="cursor: pointer;">
            <h1 class="brand-title">BNB Manager</h1>
            <p class="brand-subtitle">Operational inventory and expense management</p>
          </div>
        </div>

        <div class="header-actions">
          <div id="sync-status-badge" class="sync-badge offline" title="Click to configure Google Sheets Sync">
            <span class="badge-dot"></span>
            <span id="sync-status-text">Google Sheets: Disconnected</span>
          </div>
        </div>
      </header>
      <section id="tab-contact" class="app-tab-panel active" role="tabpanel">
        <div class="panel main-panel">
          <div class="panel-header">
            <h2>Contact Us</h2>
          </div>
          <div class="panel-body">
            <p>For support or inquiries, please contact us at:</p>
            <p>Email: rodalyn74@gmail.com</p>
            <p>We welcome your feedback and suggestions to improve BNB Manager.</p>
          </div>
        </div>
      </section>
      <div id="footer-placeholder"></div>
      <script>
        fetch('../common/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
      </script>
    </div> <!-- app-shell end -->
  </body>
</html>
